name: Site checks
on:
  pull_request:
    branches: [hml, main]
  push:
    branches: [hml, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-tests:
    name: Site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - name: Repeat mobile shade interaction
        run: npx playwright test --project=mobile-webkit --grep "tratamentos fechados" --repeat-each=5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
